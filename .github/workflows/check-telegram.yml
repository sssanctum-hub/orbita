name: Check Telegram connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-telegram.yml
      - scripts/check-telegram.mjs
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bot and channel permissions without sending
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-1004378561792'
        run: node scripts/check-telegram.mjs
